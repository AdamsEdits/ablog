---
layout: default
title: Tags
permalink: /tag/
---

<h1>Tags</h1>

<ul>
  {% assign tags = site.tags | sort %}

  {% for tag in tags %}
  {% assign name = tag[0] %}
  {% assign slug = name | slugify %}
  <li>
    <a href="{{ '/tag/' | append: slug | append: '/' | relative_url }}">
      {{ name }} ({{ tag[1] | size }})
    </a>
  </li>
{% endfor %}
</ul>
